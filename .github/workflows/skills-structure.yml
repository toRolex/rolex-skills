name: Skills structure

on:
  push:
  pull_request:

jobs:
  check:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check skill structure
        run: node scripts/check-skills-structure.mjs

      - name: Test skill structure checker
        run: node --test scripts/check-skills-structure.test.mjs
